<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="forgot-password-page">

    <nav class="forgot-nav">
        <a href="{{ url_for('home') }}" class="forgot-brand"></a>

        <div class="forgot-nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </nav>

    <main class="forgot-section">
        <div class="forgot-card">

            <div class="forgot-envelope"></div>

            <h1>Forgot your password?</h1>

            <div class="forgot-divider"></div>

            <p class="forgot-description">
                No worries — let's get you back to your memories.
            </p>

            <form method="POST" class="forgot-form">
                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

                <button type="submit" class="forgot-button">
                    Send reset code 
                </button>
            </form>

        </div>

        <p class="forgot-footer">
            Remembered your password?
            <a href="{{ url_for('login') }}">Log in →</a>
        </p>
    </main>

</body>

</html>
