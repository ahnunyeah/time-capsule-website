<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Time Capsule</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="reset-password-page">

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">Time Capsule</div>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </nav>

    <!-- Reset Password Section -->
    <section class="reset-password-section">

        <div class="reset-decoration reset-decoration-one">♡</div>
        <div class="reset-decoration reset-decoration-two">✦</div>

        <div class="reset-password-card">

            <div class="reset-password-icon">🔐</div>

            <p class="reset-eyebrow">A FRESH START</p>

            <h1>Reset Your <span>Password</span></h1>

            <p class="reset-subtitle">
                Create a new password and keep your
                memories safe for the future.
            </p>

            <form method="POST" class="reset-password-form">

                <label for="code">Password Reset Code</label>

                <input
                    type="text"
                    id="code"
                    name="code"
                    placeholder="Paste the code from your terminal"
                    autocomplete="off"
                    required
                >

                <p class="reset-hint">
                    ✧ Find your reset code in the terminal where
                    your Flask app printed it.
                </p>

                <label for="password">New Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="confirm_password">Confirm New Password</label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" class="reset-password-button">
                    Update My Password <span>♡</span>
                </button>

            </form>

            <p class="reset-login-link">
                Remember your password?
                <a href="{{ url_for('login') }}">Back to Login</a>
            </p>

            <p class="reset-footer">
                Your memories are precious. Keep them protected.
            </p>

        </div>

    </section>

</body>
</html>
